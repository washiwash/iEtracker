<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="../../resources/images/logo.svg" />
    <title>iEtracker - Log in Account</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../../styles/login.css" />
  </head>
  <body>
    <div class="container-login">
      <div class="logo-circle">
        <img src="../../resources/images/logo.svg" alt="Logo" />
      </div>

      <div class="title">Welcome to <span>iEtracker</span></div>
      <div class="subtitle">Sign in to access your workspace</div>

      <div class="login-card">
        <label class="form-label">Email Address</label>
        <div class="input-group mb-3">
          <span class="input-group-text">
            <i class="bi bi-envelope"></i>
          </span>
          <input type="email" class="form-control" placeholder="you@example.com" />
        </div>

        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-lock"></i>
          </span>
          <input type="password" class="form-control" placeholder="Enter your password" />
          <span class="input-group-text">
            <i class="bi bi-eye"></i>
          </span>
        </div>

        <a href="#" class="forgot">Forgot password?</a>

        <button class="signin-btn">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>

        <div class="bottom-text">
          Don't have an account?
          <a href="../authenticator/register.html">Create Account</a>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </body>
</html>
