<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="../../resources/images/logo.svg" />

    <title>iEtracker - Create Account</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="/styles/register.css" />
  </head>

  <body>
    <div class="container">
<div>
  <img src="../../resources/images/logo.svg" alt="iEtracker logo" />
</div>
      <div class="title">Create your <span>iEtracker</span> account</div>

      <div class="subtitle">Fill in your details to get started</div>

      <div class="card">
        <label>Full Name</label>
        <input type="text" placeholder="e.g. John Doe" />

        <label>Email Address</label>
        <input type="email" placeholder="you@example.com" />

        <label>Role / Position</label>
        <input type="text"  placeholder="add role"/>

        <label>Password</label>
        <div class="password-field">
          <input type="password" placeholder="Create a password" />
          <span>👁</span>
        </div>

        <label>Confirm Password</label>
        <div class="password-field">
          <input type="password" placeholder="Re-enter your password" />
          <span>👁</span>
        </div>

        <button>👤 Create Account</button>

        <div class="footer">
          Already have an account? <a href="../../views/authenticator/login.html">Sign In</a>
        </div>
      </div>
    </div>
  </body>
</html>
