    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>iEtracker Login</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#0b0f14;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: "Segoe UI", sans-serif;
}

.container-login{
    width:420px;
    text-align:center;
}

.logo-circle{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:50%;
    background:#0e2a38;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:15px;
}

.logo-circle i{
    color:#3ec6ff;
    font-size:32px;
}

.title{
    color:#e6e6e6;
    font-size:28px;
    font-weight:600;
}

.title span{
    color:#36c1ff;
}

.subtitle{
    color:#8b949e;
    font-size:14px;
    margin-bottom:25px;
}

.login-card{
    background:#131820;
    padding:30px;
    border-radius:16px;
    text-align:left;
    box-shadow:0 20px 50px rgba(0,0,0,0.7);
}

.form-label{
    color:#c0c8d2;
    font-size:14px;
}

.input-group{
    border:1px solid #1f2933;
    border-radius:10px;
    overflow:hidden;
}

.input-group-text{
    background:#0b0f14;
    border:none;
    color:#6c7a89;
}

.form-control{
    background:#0b0f14;
    border:none;
    color:#e6e6e6;
}

.form-control::placeholder{
    color:#6c7a89;
}

.form-control:focus{
    background:#0b0f14;
    color:white;
    box-shadow:none;
}

.forgot{
    font-size:13px;
    color:#38c6ff;
    float:right;
    text-decoration:none;
    margin-top:6px;
}

.signin-btn{
    width:100%;
    margin-top:25px;
    padding:12px;
    border:none;
    border-radius:12px;
    color:white;
    font-weight:500;
    background:linear-gradient(90deg,#1e6c86,#26a9c8);
}

.demo-box{
    border:1px solid #1e6c86;
    border-radius:10px;
    padding:12px;
    margin-top:18px;
    text-align:center;
    font-size:13px;
    color:#7ed8ff;
}

.bottom-text{
    margin-top:20px;
    text-align:center;
    font-size:14px;
    color:#8b949e;
}

.bottom-text a{
    color:#36c1ff;
    text-decoration:none;
    font-weight:500;
}

</style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>iEtracker Login</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>

body{
    background:#0b0f14;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: "Segoe UI", sans-serif;
}

.container-login{
    width:420px;
    text-align:center;
}

.logo-circle{
    width:70px;
    height:70px;
    margin:auto;
    border-radius:50%;
    background:#0e2a38;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:15px;
}

.logo-circle img{
    width:45px;
    height:45px;
    object-fit:contain;
}

.title{
    color:#e6e6e6;
    font-size:28px;
    font-weight:600;
}

.title span{
    color:#36c1ff;
}

.subtitle{
    color:#8b949e;
    font-size:14px;
    margin-bottom:25px;
}

.login-card{
    background:#131820;
    padding:30px;
    border-radius:16px;
    text-align:left;
    box-shadow:0 20px 50px rgba(0,0,0,0.7);
}

.form-label{
    color:#c0c8d2;
    font-size:14px;
}

.input-group{
    border:1px solid #1f2933;
    border-radius:10px;
    overflow:hidden;
}

.input-group-text{
    background:#0b0f14;
    border:none;
    color:#6c7a89;
}

.form-control{
    background:#0b0f14;
    border:none;
    color:#e6e6e6;
}

.form-control::placeholder{
    color:#6c7a89;
}

.form-control:focus{
    background:#0b0f14;
    color:white;
    box-shadow:none;
}

.forgot{
    font-size:13px;
    color:#38c6ff;
    float:right;
    text-decoration:none;
    margin-top:6px;
}

.signin-btn{
    width:100%;
    margin-top:25px;
    padding:12px;
    border:none;
    border-radius:12px;
    color:white;
    font-weight:500;
    background:linear-gradient(90deg,#1e6c86,#26a9c8);
}

.demo-box{
    border:1px solid #1e6c86;
    border-radius:10px;
    padding:12px;
    margin-top:18px;
    text-align:center;
    font-size:13px;
    color:#7ed8ff;
}

.bottom-text{
    margin-top:20px;
    text-align:center;
    font-size:14px;
    color:#8b949e;
}

.bottom-text a{
    color:#36c1ff;
    text-decoration:none;
    font-weight:500;
}

</style>
</head>

<body>

<div class="container-login">

    <!-- Logo -->
    <div class="logo-circle">
        <img src="/resources/images/logo.svg" alt="Logo">
    </div>

    <div class="title">Welcome to <span>iEtracker</span></div>
    <div class="subtitle">Sign in to access your workspace</div>

    <div class="login-card">

        <label class="form-label">Email Address</label>
        <div class="input-group mb-3">
            <span class="input-group-text">
                <i class="bi bi-envelope"></i>
            </span>
            <input type="email" class="form-control" placeholder="you@example.com">
        </div>

        <label class="form-label">Password</label>
        <div class="input-group">
            <span class="input-group-text">
                <i class="bi bi-lock"></i>
            </span>
            <input type="password" class="form-control" placeholder="Enter your password">
            <span class="input-group-text">
                <i class="bi bi-eye"></i>
            </span>
        </div>

        <a href="#" class="forgot">Forgot password?</a>

        <button class="signin-btn">
            <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>

        <div class="demo-box">
            Demo: use any seeded user email (e.g.<br>
            <b>sarah.chen@ietracker.com</b>) with password<br>
            <b>Password1!</b>
        </div>

        <div class="bottom-text">
            Don't have an account?
            <a href="#">Create Account</a>
        </div>

    </div>

</div>

</body>
</html>
