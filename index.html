<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iEtracker</title>
    <link rel="icon" type="image/svg+xml" href="./resources/images/logo.svg" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg app-navbar">
      <div class="container-fluid app-navbar-inner">
        <a
          href="#"
          class="app-brand d-flex align-items-center gap-2 text-decoration-none">
          <img class="app-logo" src="./resources/images/logo.svg" alt="logo" />
          <div class="d-flex align-items-center lh-1">
            <span class="text-info fs-5 fw-bold text-decoration-none">iE</span
            ><span class="text-white fs-5 fw-bold text-decoration-none"
              >tracker</span
            >
          </div>
        </a>

        <div class="d-flex align-items-center gap-3 app-navbar-actions">
          <div class="d-flex align-items-center gap-2 app-navbar-tools">
            <button
              type="button"
              class="btn btn-info btn-sm px-3 fw-medium text-white">
              <i class="bi bi-plus-lg"></i> Create
            </button>
            <button
              class="btn app-icon-btn"
              type="button"
              aria-label="Notifications">
              <i class="bi bi-bell fs-5 text-white"></i>
            </button>
            <button class="btn app-icon-btn" type="button" aria-label="Help">
              <i class="bi bi-question-circle fs-5 text-white"></i>
            </button>
            <button
              class="btn app-icon-btn"
              type="button"
              aria-label="Settings">
              <i class="bi bi-gear fs-5 text-white"></i>
            </button>
          </div>
          <div class="d-flex align-items-center gap-2 app-profile">
            <span class="text-white small fw-medium">John Doe</span>
            <span class="rounded-pill bg-info text-dark fw-semibold px-2 py-1"
              >JD</span
            >
          </div>
        </div>
      </div>
    </nav>

    <aside class="sidebar d-flex flex-column p-3">
      <!-- Workspace Switcher Area -->
      <div class="d-flex align-items-center justify-content-between mb-4 p-2">
        <div class="d-flex align-items-center gap-2">
          <span
            class="rounded-circle bg-info text-dark fw-bold d-flex align-items-center justify-content-center"
            style="width: 32px; height: 32px"
            >J</span
          >
          <span class="text-white fw-medium small">John's Workspace</span>
        </div>

        <i class="bi bi-caret-down-fill text-secondary"></i>
      </div>

      <span
        class="border border-bottom-0 border-info"
        style="--bs-border-opacity: 0.1"></span>
      <!-- Primary Navigation -->
      <div class="d-flex flex-column gap-1 mb-4">
        <!-- <small class="text-uppercase text-secondary fw-bold mb-2 px-2" style="font-size: 0.7rem; letter-spacing: 1px;">Main Menu</small> -->
        <a
          href="#"
          class="nav-link active d-flex align-items-center gap-3 mt-3">
          <i class="bi bi-house-door"></i> Dashboard
        </a>
        <a href="#" class="nav-link d-flex align-items-center gap-3">
          <i class="bi bi-check2-square"></i> Task Tracker
        </a>
        <a href="#" class="nav-link d-flex align-items-center gap-3">
          <i class="bi bi-person-gear"></i> Profile Settings
        </a>
      </div>

      <!-- Projects Section -->
      <div class="d-flex flex-column gap-1">
        <div
          class="d-flex align-items-center justify-content-between px-2 mb-2">
          <small
            class="text-uppercase text-secondary fw-bold"
            style="font-size: 0.7rem; letter-spacing: 1px"
            >Projects</small
          >
          <button class="btn btn-sm p-0 text-white">
            <i class="bi bi-plus-lg"></i>
          </button>
        </div>
        <a href="#" class="nav-link d-flex align-items-center gap-3">
          <i class="bi bi-hash text-info"></i> Project iETracker
        </a>
        <a href="#" class="nav-link d-flex align-items-center gap-3">
          <i class="bi bi-hash text-warning"></i> Marketing Site
        </a>
      </div>
    </aside>

    <main class="app-main">

      <h1 class="text-white fw-semibold mb-1">Welcome, John Doe!</h1>
      <p class="text-secondary mb-4">Monday, March 9, 2026</p>
      <span class="text-white">Quick Actions </span>

      <section class="d-flex gap-5 justify-content-center">

      <div
        class="content-card quick-action-card d-flex align-items-center gap-3 text-light">
        <div class="d-flex flex-column">
          <div>
           <i class="bi bi-plus-lg fs-4 text-info"></i>
          <span class="fs-5 fw-semibold">Time In</span>
          </div>
          <span class="fs-6 text-secondary mx-4">Already clocked out</span>
        </div>
      </div>

       <div
        class="content-card quick-action-card d-flex align-items-center gap-3 text-light">
        <div class="d-flex flex-column">
          <div>
           <i class="bi bi-plus-lg fs-4 text-info"></i>
          <span class="fs-5 fw-semibold">Time Out</span>
          </div>
          <span class="fs-6 text-secondary mx-4">Already clocked out</span>
        </div>
      </div>

      <div
        class="content-card quick-action-card d-flex align-items-center gap-3 text-light">
        <div class="d-flex flex-column">
          <div>
           <i class="bi bi-plus-lg fs-4 text-info"></i>
          <span class="fs-5 fw-semibold">Add Task</span>
          </div>
          <span class="fs-6 text-secondary mx-4">Already clocked out</span>
        </div>
      </div>

      </section>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </body>
</html>
